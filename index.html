<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Book</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <main>
        <div class="max-w-[1000px] m-auto p-10">
            <div
                class="relative flex flex-col w-full h-full text-gray-700 bg-white shadow-2xl rounded-lg bg-clip-border">
                <table class="w-full text-left table-auto min-w-max">
                    <thead>
                        <tr>
                            <th class="p-4 border-b border-slate-300 bg-black">
                                <p class="block text-sm font-semibold leading-none text-white">
                                    ID
                                </p>
                            </th>
                            <th class="p-4 border-b border-slate-300 bg-black">
                                <p class="block text-sm font-semibold leading-none text-white">
                                    NAME
                                </p>
                            </th>
                            <th class="p-4 border-b border-slate-300 bg-black">
                                <p class="block text-sm font-semibold leading-none text-white">
                                    PHONE
                                </p>
                            </th>
                            <th class="p-4 border-b border-slate-300 bg-black">
                                <p class="block text-sm font-semibold leading-none text-white">
                                    EMAIL
                                </p>
                            </th>
                            <th class="p-4 border-b border-slate-300 bg-black">
                                <p class="block text-sm font-semibold leading-none text-white"></p>
                            </th>
                        </tr>
                    </thead>
                    <tbody id="contactList">
                    </tbody>
                </table>
            </div>
        </div>
    </main>
    <script src="./js/script.js"></script>
</body>

</html>
