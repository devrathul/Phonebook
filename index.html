<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Book</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <main>
        <div class="max-w-[1000px] m-auto p-10">
            <div class="flex">
                <div class="w-full max-w-[500px] m-auto">
                    <div class="w-full bg-gray-100 shadow-2xl rounded-lg p-5 my-5">
                        <form id="saveUserForm">
                            <div class="flex flex-col mb-5">
                                <lable for="txtName">Name</lable>
                                <input class="outline-none mt-4 border rounded-md p-1" type="text" name="txtName"
                                    id="txtName" required />
                            </div>
                            <div class="flex flex-col mb-5">
                                <lable for="txtPhone">Phone</lable>
                                <input class="outline-none mt-4 border rounded-md p-1" type="text" name="txtPhone"
                                    id="txtPhone" required />
                            </div>
                            <div class="flex flex-col mb-5">
                                <lable for="txtEmail">Email</lable>
                                <input class="outline-none mt-4 border rounded-md p-1" type="text" name="txtEmail"
                                    id="txtEmail" required />
                            </div>
                            <div class="flex justify-center items-center my-10">
                                <button type="submit" class="flex gap-2 px-4 py-2 rounded-md bg-slate-400">
                                    <span class="text-white">Save</span>
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                        stroke-width="1.5" stroke="#fff" class="size-6">
                                        <path stroke-linecap="round" stroke-linejoin="round"
                                            d="M17.593 3.322c1.1.128 1.907 1.077 1.907 2.185V21L12 17.25 4.5 21V5.507c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 0 1 11.186 0Z" />
                                    </svg>
                                </button>
                            </div>
                        </form>
                        <form id="updateUserForm" class="hidden">
                            <input type="hidden" name="txtID" id="txtID" value="">
                            <div class="flex flex-col mb-5">
                                <lable for="txtName">Name</lable>
                                <input class="outline-none mt-4 border rounded-md p-1" type="text" name="txtName"
                                    id="txtUpdateName" required />
                            </div>
                            <div class="flex flex-col mb-5">
                                <lable for="txtPhone">Phone</lable>
                                <input class="outline-none mt-4 border rounded-md p-1" type="text" name="txtPhone"
                                    id="txtUpdatePhone" required />
                            </div>
                            <div class="flex flex-col mb-5">
                                <lable for="txtEmail">Email</lable>
                                <input class="outline-none mt-4 border rounded-md p-1" type="text" name="txtEmail"
                                    id="txtUpdateEmail" required />
                            </div>
                            <div class="flex justify-center items-center my-10">
                                <button type="submit" class="flex gap-2 px-4 py-2 rounded-md bg-slate-400">
                                    <span class="text-white">Update</span>
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                        stroke-width="1.5" stroke="#fff" class="size-6">
                                        <path stroke-linecap="round" stroke-linejoin="round"
                                            d="M17.593 3.322c1.1.128 1.907 1.077 1.907 2.185V21L12 17.25 4.5 21V5.507c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 0 1 11.186 0Z" />
                                    </svg>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            <div class="flex flex-grow-3 items-center gap-2 border border-slate-300 p-2 rounded-md my-10">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="#cbd5e1" class="size-5">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
                </svg>
                <input class="w-full outline-none" type="search" id="txtusersearch"
                    placeholder="Please enter user name..." />
            </div>
            <div class="flex flex-col w-full h-full text-gray-700 bg-white shadow-2xl rounded-lg bg-clip-border">

                <table class="w-full text-left table-auto min-w-max">
                    <thead>
                        <tr>
                            <th class="p-4 border-b border-slate-300 bg-black">
                                <p class="block text-sm font-semibold leading-none text-white">
                                    ID
                                </p>
                            </th>
                            <th class="p-4 border-b border-slate-300 bg-black">
                                <p class="block text-sm font-semibold leading-none text-white">
                                    NAME
                                </p>
                            </th>
                            <th class="p-4 border-b border-slate-300 bg-black">
                                <p class="block text-sm font-semibold leading-none text-white">
                                    PHONE
                                </p>
                            </th>
                            <th class="p-4 border-b border-slate-300 bg-black">
                                <p class="block text-sm font-semibold leading-none text-white">
                                    EMAIL
                                </p>
                            </th>
                            <th class="p-4 border-b border-slate-300 bg-black">
                                <p class="block text-sm font-semibold leading-none text-white"></p>
                            </th>
                        </tr>
                    </thead>
                    <tbody id="contactList">
                    </tbody>
                </table>
            </div>
        </div>
    </main>
    <script src="./js/script.js"></script>
</body>

</html>
